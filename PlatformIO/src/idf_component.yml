## ESP-IDF Component Manager manifest.
## These are downloaded into managed_components/ on the first build — this is
## the mechanism the Arduino IDE lacks, and the reason this project is built
## with PlatformIO's arduino+espidf hybrid mode.
dependencies:
  # Camera sensor driver (OV2640 on the XIAO Sense expansion board).
  espressif/esp32-camera: "^2.1.6"
  # WebRTC PeerConnection: ICE + DTLS + SCTP DataChannel.
  espressif/esp_peer: "^1.5.0"
  idf:
    version: ">=5.3.0"
