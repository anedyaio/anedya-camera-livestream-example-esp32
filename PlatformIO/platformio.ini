; =============================================================================
; PlatformIO project — Anedya WebRTC Camera Livestream (Arduino)
;
; Why PlatformIO and not the plain Arduino IDE:
;   The WebRTC engine (espressif/esp_peer) is an ESP-IDF managed component and
;   needs sdkconfig options that the Arduino IDE's *precompiled* core does not
;   ship (CONFIG_MBEDTLS_SSL_DTLS_SRTP in particular). The Arduino IDE cannot
;   change sdkconfig, so esp_peer cannot link there.
;
;   PlatformIO's hybrid mode — framework = arduino, espidf — builds ESP-IDF from
;   source with Arduino as a component. You still write Arduino code
;   (setup()/loop(), WiFi.h, PubSubClient, ArduinoJson) but you can also pull IDF
;   managed components and set sdkconfig. See README.md.
;
; Boards — pick one with -e:
;   pio run -e seeed_xiao_esp32s3          -t upload -t monitor
;   pio run -e dfrobot_firebeetle2_esp32s3 -t upload -t monitor
;   pio run -e dfrobot_romeo_esp32s3       -t upload -t monitor
;   pio run -e esp32cam                    -t upload -t monitor
;
; Board-specific ESP-IDF settings are NOT here — they live in
; sdkconfig.defaults.<target>, which ESP-IDF merges on top of sdkconfig.defaults
; automatically. Same split the ESP-IDF version of this example uses.
; =============================================================================

[env]
; pioarduino platform (community fork of platform-espressif32; the official one
; is stuck on older Arduino/IDF). 55.03.311 = Arduino 3.3.11 / ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino, espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.2

build_flags =
	; Anedya command payloads (base64 of a deflated SDP) are ~1.4 KB; the
	; PubSubClient default of 256 bytes silently drops them. The code also calls
	; setBufferSize() at runtime, this just keeps the two in sync.
	-DMQTT_MAX_PACKET_SIZE=4096
	-Wno-format


; ── Seeed Studio XIAO ESP32S3 Sense ─────────────────────────────────────────
; ESP32-S3 · 8 MB flash · 8 MB octal PSRAM · OV2640 on the Sense expansion board
; · native USB (no programmer needed).
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3

; Required, and NOT redundant with CONFIG_PARTITION_TABLE_CUSTOM in
; sdkconfig.defaults. That setting only tells the ESP-IDF build which table to
; compile against; PlatformIO generates and flashes partitions.bin itself, and
; it reads this key instead. The seeed_xiao_esp32s3 board manifest defines no
; build.partitions, so without this line PlatformIO falls back to ESP-IDF's
; partitions_singleapp.csv — a 1 MB factory app. This firmware is ~1.27 MB, so
; the device flashes fine and then boot-loops with:
;   E esp_image: Image length 1334608 doesn't fit in partition length 1048576
board_build.partitions = partitions.esp32s3.csv

build_flags =
	${env.build_flags}
	-DCAMERA_MODEL_XIAO_ESP32S3


; ── DFRobot FireBeetle 2 ESP32-S3 ───────────────────────────────────────────
; ESP32-S3 · 16 MB flash · 8 MB octal PSRAM · camera on the FPC connector.
; Buy the N16R8 (PSRAM) variant — the no-PSRAM SKUs cannot run this example.
[env:dfrobot_firebeetle2_esp32s3]
board = dfrobot_firebeetle2_esp32s3
board_build.partitions = partitions.esp32s3.csv

; The stock board manifest describes the *base* FireBeetle 2 S3: 4 MB flash, no
; PSRAM declared, and no USB CDC on boot. The camera-capable N16R8 variant needs
; all three corrected, otherwise the upload is size-capped, psramFound() lies,
; and Serial goes to UART0 instead of the USB port.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

build_flags =
	${env.build_flags}
	-DCAMERA_MODEL_DFROBOT_ESP32S3
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1


; ── DFRobot Romeo ESP32-S3 ──────────────────────────────────────────────────
; ESP32-S3 · 16 MB flash · 8 MB octal PSRAM. Same camera pinout as the
; FireBeetle 2 above; its board manifest already declares PSRAM and USB CDC.
[env:dfrobot_romeo_esp32s3]
board = dfrobot_romeo_esp32s3
board_build.partitions = partitions.esp32s3.csv

build_flags =
	${env.build_flags}
	-DCAMERA_MODEL_DFROBOT_ESP32S3


; ── ESP32-CAM style boards (AI Thinker, DFRobot clones) ─────────────────────
; ESP32 · 4 MB flash · 4 MB quad PSRAM · OV2640/OV3660 · needs an external
; USB-to-serial programmer (FTDI, CP2102) and IO0 pulled to GND to flash.
;
; These modules all carry the same ESP32-CAM pinout, so one env and one pin map
; cover them. If your board differs, add a block to include/camera_pins.h and a
; matching -DCAMERA_MODEL_* here rather than editing the existing one.
[env:esp32cam]
board = esp32cam

; Same reason as above — the esp32cam manifest declares huge_app.csv, which is
; a 3 MB app with no room for the layout the ESP-IDF example uses.
board_build.partitions = partitions.csv

build_flags =
	${env.build_flags}
	-DCAMERA_MODEL_AI_THINKER

; Prevent the PlatformIO Serial Monitor from holding the esp32cam-mb shield in reset
monitor_dtr = 0
monitor_rts = 0

; ── DFRobot ESP32-S3 AI Camera ──────────────────────────────────────────────
; ESP32-S3 · 16 MB flash · 8 MB octal PSRAM.
[env:dfrobot_ai_camera]
board = dfrobot_firebeetle2_esp32s3
board_build.partitions = partitions.esp32s3.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_flags =
	${env.build_flags}
	-DCAMERA_MODEL_DFROBOT_AI_CAMERA
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
